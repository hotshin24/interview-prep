<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000" id="themeColor">
<title>{{TITLE}}</title>
<style>
/* ============ iOS design tokens — 다크 기본 ============ */
/* iOS Dark: 시스템 컬러 + Elevated Grouped Background 계열 */
:root{
  --blue:#0a84ff; --blue-2:#409cff;
  --red:#ff453a; --orange:#ff9f0a; --green:#30d158; --purple:#bf5af2; --pink:#ff375f;
  --bg:#000000;                 /* systemBackground */
  --bg-elev:#1c1c1e;            /* secondarySystemBackground */
  --bg-grouped:#1c1c1e;         /* secondarySystemGroupedBackground */
  --bg-raised:#2c2c2e;          /* tertiarySystemBackground */
  --fill-1:rgba(120,120,128,.24);
  --fill-2:rgba(120,120,128,.32);
  --fill-3:rgba(120,120,128,.16);
  --label:#ffffff;
  --label-2:rgba(235,235,245,.62);
  --label-3:rgba(235,235,245,.32);
  --separator:rgba(84,84,88,.60);
  --separator-opaque:#38383a;
  --bar:rgba(20,20,22,.78);
  --sidebar:rgba(26,26,28,.84);
  --card-line:rgba(255,255,255,.055);   /* 다크에서 카드 경계 확보 */
  --shadow:0 1px 2px rgba(0,0,0,.55);
  --shadow-lg:0 12px 44px rgba(0,0,0,.66);
  --code-bg:#0c0c0e;
  --code-fg:#f2f2f7;
  --radius:16px;
  --radius-sm:10px;
  --sidebar-w:322px;
  --bar-h:52px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Apple SD Gothic Neo","Pretendard","Helvetica Neue",system-ui,"Segoe UI","Noto Sans KR",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
}
/* 토글로 밝은 테마를 고른 경우에만 라이트 팔레트 */
html[data-theme="light"]{
  --blue:#007aff; --blue-2:#0a84ff;
  --red:#ff3b30; --orange:#ff9500; --green:#34c759; --purple:#af52de; --pink:#ff2d55;
  --bg:#f2f2f7; --bg-elev:#ffffff; --bg-grouped:#ffffff; --bg-raised:#ffffff;
  --fill-1:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.16); --fill-3:rgba(120,120,128,.08);
  --label:#000000; --label-2:rgba(60,60,67,.60); --label-3:rgba(60,60,67,.30);
  --separator:rgba(60,60,67,.18); --separator-opaque:#c6c6c8;
  --bar:rgba(249,249,251,.82); --sidebar:rgba(246,246,248,.86);
  --card-line:transparent;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.05);
  --shadow-lg:0 10px 40px rgba(0,0,0,.18);
  --code-bg:#1c1c1e; --code-fg:#f2f2f7;
}

*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto;} *{animation-duration:.01ms !important;transition-duration:.01ms !important;}}
body{
  margin:0;background:var(--bg);color:var(--label);
  font-family:var(--font);font-size:17px;line-height:1.62;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  word-break:keep-all; overflow-wrap:anywhere;
}
a{color:var(--blue);text-decoration:none;}
::selection{background:color-mix(in srgb, var(--blue) 26%, transparent);}

/* ============ top bar ============ */
.topbar{
  position:fixed;top:0;left:0;right:0;height:calc(var(--bar-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--separator);
  display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:14px;
  z-index:60;
}
.topbar .menu-btn{display:none;}
.topbar .crumb{
  flex:1;min-width:0;font-size:15px;font-weight:600;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;
  transition:opacity .25s ease;
}
.topbar .crumb .c-num{color:var(--blue);font-variant-numeric:tabular-nums;margin-right:6px;}
.icon-btn{
  -webkit-appearance:none;appearance:none;border:0;background:var(--fill-1);color:var(--blue);
  width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  cursor:pointer;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s;flex:none;
}
.icon-btn:active{transform:scale(.9);background:var(--fill-2);}
.icon-btn svg{width:17px;height:17px;}
.progress{position:absolute;left:0;bottom:-.5px;height:2px;background:var(--blue);width:0;border-radius:0 2px 2px 0;transition:width .1s linear;}

/* ============ layout ============ */
.layout{display:flex;min-height:100vh;}
.sidebar{
  position:fixed;top:calc(var(--bar-h) + env(safe-area-inset-top));bottom:0;left:0;width:var(--sidebar-w);
  background:var(--sidebar);
  -webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-right:.5px solid var(--separator);
  display:flex;flex-direction:column;z-index:50;
}
.side-head{padding:12px 14px 8px;}
.search{
  position:relative;display:flex;align-items:center;
  background:var(--fill-1);border-radius:10px;height:36px;padding:0 10px;gap:7px;
}
.search svg{width:15px;height:15px;color:var(--label-2);flex:none;}
.search input{
  flex:1;border:0;background:transparent;outline:none;font:inherit;font-size:15px;color:var(--label);
  min-width:0;
}
.search input::placeholder{color:var(--label-2);}
.search .clear{display:none;border:0;background:var(--label-3);color:var(--bg-elev);border-radius:50%;width:17px;height:17px;font-size:11px;line-height:1;cursor:pointer;align-items:center;justify-content:center;padding:0;}
.search.has-value .clear{display:inline-flex;}
.side-meta{display:flex;gap:6px;padding:9px 4px 2px;font-size:11.5px;color:var(--label-2);}
.side-meta b{color:var(--label);font-weight:600;font-variant-numeric:tabular-nums;}
.side-meta span{background:var(--fill-3);border-radius:7px;padding:3px 8px;}

.toc{
  flex:1;overflow-y:auto;overscroll-behavior:contain;
  padding:6px 10px calc(28px + env(safe-area-inset-bottom));
  scrollbar-width:thin;scrollbar-color:var(--label-3) transparent;
}
.toc::-webkit-scrollbar{width:7px;}
.toc::-webkit-scrollbar-thumb{background:var(--label-3);border-radius:4px;border:2px solid transparent;background-clip:content-box;}
.toc ul{list-style:none;margin:0;padding:0;}
.toc-chapter{margin-bottom:2px;}
.toc-ch-btn{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;
  border:0;background:transparent;color:var(--label);font:inherit;font-size:14.5px;font-weight:600;
  letter-spacing:-.02em;padding:9px 9px;border-radius:10px;transition:background .18s;
}
.toc-ch-btn:hover{background:var(--fill-3);}
.toc-chapter.active > .toc-ch-btn{background:var(--fill-1);}
.toc-ch-num{
  flex:none;width:23px;height:23px;border-radius:7px;background:var(--fill-2);color:var(--label-2);
  font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
  transition:background .2s,color .2s;
}
.toc-chapter.active .toc-ch-num{background:var(--blue);color:#fff;}
.toc-ch-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toc-count{font-size:11px;color:var(--label-3);font-variant-numeric:tabular-nums;flex:none;}
.chev{width:8px;height:13px;color:var(--label-3);flex:none;transition:transform .28s cubic-bezier(.2,.8,.2,1);}
.toc-ch-btn[aria-expanded="true"] .chev{transform:rotate(90deg);}

.toc-sub{display:none;padding-bottom:4px;}
.toc-chapter.open .toc-sub{display:block;animation:reveal .26s cubic-bezier(.2,.8,.2,1);}
@keyframes reveal{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.toc-sub a{
  display:flex;align-items:center;gap:8px;padding:6.5px 10px 6.5px 12px;margin-left:20px;
  border-radius:8px;color:var(--label-2);font-size:13.5px;line-height:1.35;
  transition:background .16s,color .16s;position:relative;
}
.toc-sub a:hover{background:var(--fill-3);color:var(--label);}
.toc-q a.current{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue);font-weight:600;}
.toc-q a.current .q-num{background:var(--blue);color:#fff;}
.q-num{
  flex:none;min-width:26px;height:19px;padding:0 5px;border-radius:6px;background:var(--fill-1);
  color:var(--label-2);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.q-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toc-sub .m{font-size:10px;flex:none;filter:saturate(1.1);}
.toc-group a{
  margin-left:8px;font-weight:600;color:var(--label);font-size:12.5px;text-transform:none;
  padding-top:9px;padding-bottom:5px;letter-spacing:-.01em;
}
.toc-group a:hover{background:transparent;}
.toc-group a.current{color:var(--blue);}
.g-num{color:var(--blue);font-weight:700;margin-right:2px;font-variant-numeric:tabular-nums;}
.toc .empty{display:none;padding:26px 12px;text-align:center;color:var(--label-2);font-size:14px;}
.toc.filtering .toc-sub{display:block;}
.toc.filtering .toc-ch-btn .chev{opacity:.25;}
li.hide{display:none !important;}

/* ============ content ============ */
main{
  margin-left:var(--sidebar-w);flex:1;min-width:0;
  padding:calc(var(--bar-h) + env(safe-area-inset-top) + 26px) 40px 140px;
}
.wrap{max-width:788px;margin:0 auto;}

.hero{
  background:var(--bg-elev);border-radius:22px;padding:30px 30px 26px;box-shadow:var(--shadow);
  margin-bottom:34px;position:relative;overflow:hidden;
}
.hero::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 100% 0%, color-mix(in srgb,var(--blue) 12%,transparent), transparent 60%);
}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:8px;}
.hero h1{font-size:clamp(26px,3.6vw,34px);line-height:1.25;letter-spacing:-.03em;margin:0 0 10px;font-weight:700;}
.hero .sub{color:var(--label-2);font-size:14.5px;margin:0;line-height:1.75;position:relative;z-index:1;}
.hero .sub strong{color:var(--label);font-weight:600;}
.chapter-head.no-num{padding-left:6px;}
.hero .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative;z-index:1;}
.hero .stats div{
  background:var(--fill-3);border-radius:12px;padding:9px 14px;font-size:12.5px;color:var(--label-2);
  display:flex;align-items:baseline;gap:6px;
}
.hero .stats b{font-size:19px;font-weight:700;color:var(--label);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

.chapter{margin-bottom:52px;scroll-margin-top:calc(var(--bar-h) + 26px);}
.chapter-head{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:0 4px;}
.chapter-num{
  flex:none;width:34px;height:34px;border-radius:11px;
  background:linear-gradient(150deg,var(--blue),color-mix(in srgb,var(--blue) 62%, var(--purple)));
  color:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;box-shadow:0 3px 10px color-mix(in srgb,var(--blue) 34%,transparent);
}
.chapter-title{font-size:23px;font-weight:700;letter-spacing:-.03em;margin:0;line-height:1.3;}
.group-title{
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:var(--label-2);
  margin:34px 0 12px;padding:0 6px;display:flex;align-items:center;gap:8px;
  scroll-margin-top:calc(var(--bar-h) + 26px);
}
.group-title::after{content:"";flex:1;height:.5px;background:var(--separator);}
.group-num{color:var(--blue);font-weight:800;font-variant-numeric:tabular-nums;}

/* question card */
.qa{
  background:var(--bg-grouped);border-radius:var(--radius);padding:20px 22px 6px;margin-bottom:14px;
  box-shadow:var(--shadow);scroll-margin-top:calc(var(--bar-h) + 22px);
  border:.5px solid var(--card-line);
  transition:box-shadow .3s ease,border-color .3s ease,transform .3s ease;
}
.qa.is-hot{border-color:color-mix(in srgb,var(--red) 26%,transparent);}
.qa.is-warn{border-color:color-mix(in srgb,var(--orange) 30%,transparent);}
.qa.flash{animation:flash .9s ease;}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 55%,transparent);}100%{box-shadow:0 0 0 14px transparent;}}
.qa-title{
  display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap;
  font-size:18px;font-weight:700;letter-spacing:-.024em;line-height:1.42;margin:0 0 14px;
}
.qa-num{
  flex:none;min-width:30px;height:24px;padding:0 7px;border-radius:8px;background:var(--fill-1);
  color:var(--blue);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;margin-top:2px;
}
.qa-text{flex:1;min-width:0;}
.qa-body > *:first-child{margin-top:0;}
.badge{
  flex:none;display:inline-flex;align-items:center;gap:2px;border-radius:20px;padding:2px 8px;
  font-size:11px;font-weight:700;margin-top:3px;line-height:1.6;
}
.badge-hot{background:color-mix(in srgb,var(--red) 14%,transparent);}
.badge-warn{background:color-mix(in srgb,var(--orange) 18%,transparent);}
.badge .x2{color:var(--red);font-size:10px;}

/* text blocks */
p{margin:0 0 14px;}
strong{font-weight:700;letter-spacing:-.015em;}
.qa-body p, .qa-body ul, .qa-body ol{color:var(--label);}
ul,ol{margin:0 0 14px;padding-left:22px;}
li{margin-bottom:6px;}
li::marker{color:var(--label-3);}
ul li::marker{color:var(--blue);}

code{
  font-family:var(--mono);font-size:.855em;background:var(--fill-1);
  padding:1.5px 5px;border-radius:5px;letter-spacing:0;white-space:nowrap;
  color:color-mix(in srgb,var(--label) 85%, var(--pink));
}
.code{margin:0 0 16px;border-radius:12px;overflow:hidden;background:var(--code-bg);box-shadow:var(--shadow);}
.code figcaption{
  font-family:var(--mono);font-size:11px;color:rgba(235,235,245,.5);
  padding:8px 14px;border-bottom:.5px solid rgba(255,255,255,.09);
  display:flex;align-items:center;gap:7px;letter-spacing:.03em;
}
.code figcaption::before{
  content:"";width:9px;height:9px;border-radius:50%;background:#ff5f57;
  box-shadow:14px 0 0 #febc2e, 28px 0 0 #28c840;margin-right:32px;
}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.code code{
  background:none;padding:0;border-radius:0;white-space:pre;color:var(--code-fg);
  font-size:13px;line-height:1.65;display:block;
}

/* answer block */
.answer{display:flex;gap:11px;margin:0 0 15px;}
.a-chip{
  flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px;
  box-shadow:0 2px 6px color-mix(in srgb,var(--blue) 40%,transparent);
}
.a-body{flex:1;min-width:0;}

/* tip (▸) */
.tip{
  display:flex;gap:9px;background:var(--fill-3);border-radius:12px;padding:12px 14px;margin:0 0 14px;
  font-size:15px;color:var(--label-2);line-height:1.58;
}
.tip strong{color:var(--label);}
.tip-mark{color:var(--blue);font-weight:700;flex:none;}

/* blockquote / note */
.note{
  margin:0 0 16px;padding:13px 16px;border-radius:12px;
  background:color-mix(in srgb,var(--orange) 11%,transparent);
  border-left:3px solid var(--orange);
  font-size:15.5px;line-height:1.58;color:var(--label);
}
.note strong{color:var(--label);}

/* tables — iOS grouped list */
.table-wrap{
  margin:0 0 16px;border-radius:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  border:.5px solid var(--separator);background:var(--bg-elev);
}
table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:min(520px,100%);}
thead th{
  background:var(--fill-3);text-align:left;font-weight:700;font-size:12.5px;letter-spacing:.01em;
  color:var(--label-2);padding:10px 14px;border-bottom:.5px solid var(--separator);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:.5px solid var(--separator);vertical-align:top;line-height:1.55;}
tbody tr:last-child td{border-bottom:0;}
tbody tr:nth-child(even){background:color-mix(in srgb,var(--fill-3) 45%,transparent);}
td code, th code{white-space:normal;}

/* chapter intro paragraphs outside cards */
.chapter > p, .chapter > .note, .chapter > .table-wrap, .chapter > ul, .chapter > ol{
  margin-left:4px;margin-right:4px;
}


/* ============ 읽어주기 (TTS) ============ */
.speak-btn{
  flex:none;-webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  width:28px;height:28px;border-radius:50%;background:var(--fill-1);color:var(--blue);
  display:inline-flex;align-items:center;justify-content:center;margin-top:1px;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s,opacity .2s;
  opacity:.55;
}
.qa:hover .speak-btn{opacity:1;}
.speak-btn:active{transform:scale(.88);}
.speak-btn svg{width:14px;height:14px;}
.qa.speaking .speak-btn{opacity:1;background:var(--blue);color:#fff;}
.qa.speaking{
  border-color:color-mix(in srgb,var(--blue) 55%,transparent);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 28%,transparent), var(--shadow);
}
.qa.speaking .qa-num{background:var(--blue);color:#fff;}
html.no-tts .speak-btn, html.no-tts .player{display:none !important;}

.player{
  position:fixed;z-index:75;left:calc(var(--sidebar-w) + 22px);right:22px;bottom:22px;
  margin:0 auto;max-width:660px;
  background:var(--bar);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border:.5px solid var(--separator);border-radius:18px;box-shadow:var(--shadow-lg);
  padding:9px 12px;display:flex;align-items:center;gap:9px;overflow:hidden;
  transform:translateY(180%);opacity:0;pointer-events:none;
  transition:transform .4s cubic-bezier(.32,.72,0,1),opacity .3s ease;
}
body.tts-on .player{transform:none;opacity:1;pointer-events:auto;}
.player .p-bar{position:absolute;left:0;top:0;height:2px;background:var(--blue);width:0;transition:width .3s linear;}
.p-info{flex:1;min-width:0;}
.p-title{
  font-size:13px;font-weight:600;letter-spacing:-.02em;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:var(--label);
}
.p-sub{font-size:11px;color:var(--label-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.p-sub b{color:var(--blue);font-weight:600;}
.p-btn{
  flex:none;-webkit-appearance:none;appearance:none;border:0;cursor:pointer;
  width:32px;height:32px;border-radius:50%;background:var(--fill-1);color:var(--label);
  display:inline-flex;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s;
}
.p-btn:active{transform:scale(.88);}
.p-btn svg{width:14px;height:14px;}
.p-btn.main{width:38px;height:38px;background:var(--blue);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--blue) 40%,transparent);}
.p-btn.main svg{width:16px;height:16px;}
.p-chip{
  flex:none;border:0;cursor:pointer;background:var(--fill-1);color:var(--label-2);
  border-radius:14px;padding:5px 10px;font:inherit;font-size:11.5px;font-weight:600;
  font-variant-numeric:tabular-nums;transition:background .2s,color .2s;
}
.p-chip:active{background:var(--fill-2);}
.p-chip.on{background:color-mix(in srgb,var(--blue) 20%,transparent);color:var(--blue);}
.p-voice{
  flex:none;max-width:118px;border:0;border-radius:14px;background:var(--fill-1);color:var(--label-2);
  font:inherit;font-size:11.5px;font-weight:600;padding:5px 8px;cursor:pointer;
  -webkit-appearance:none;appearance:none;text-overflow:ellipsis;
}
.p-voice option{background:var(--bg-elev);color:var(--label);}
@media (max-width:1080px){
  .player{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:8px 10px;gap:7px;}
  .p-voice,.player .p-chip.rate{display:none;}
  body.tts-on .fab{bottom:calc(94px + env(safe-area-inset-bottom));}
}
@media (max-width:420px){
  .p-chip.cont{display:none;}
}
@media print{ .player{display:none !important;} .speak-btn{display:none !important;} }

/* ============ mobile ============ */
.scrim{
  position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:70;opacity:0;pointer-events:none;
  transition:opacity .32s ease;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
body.sheet-open .scrim{opacity:1;pointer-events:auto;}
.fab{
  display:none;position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:65;
  border:0;border-radius:50%;width:54px;height:54px;background:var(--blue);color:#fff;cursor:pointer;
  box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 45%,transparent);
  align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
.fab:active{transform:scale(.92);}
.fab svg{width:22px;height:22px;}
.grabber{display:none;}

@media (max-width:1080px){
  :root{--sidebar-w:0px;}
  main{margin-left:0;padding:calc(var(--bar-h) + env(safe-area-inset-top) + 18px) 18px 120px;}
  .topbar .menu-btn{display:inline-flex;}
  .topbar .crumb{text-align:left;}
  .fab{display:flex;}
  .sidebar{
    top:auto;bottom:0;left:0;right:0;width:100%;height:min(86vh,760px);
    border-right:0;border-top:.5px solid var(--separator);
    border-radius:14px 14px 0 0;box-shadow:var(--shadow-lg);
    transform:translateY(102%);transition:transform .42s cubic-bezier(.32,.72,0,1);
    z-index:80;
  }
  body.sheet-open .sidebar{transform:translateY(0);}
  .grabber{display:block;width:38px;height:5px;border-radius:3px;background:var(--label-3);margin:8px auto 2px;flex:none;}
  .hero{padding:24px 20px 22px;border-radius:18px;}
  .qa{padding:18px 17px 4px;border-radius:14px;}
  .qa-title{font-size:17px;}
  body{font-size:16.5px;}
}
@media (max-width:520px){
  main{padding-left:13px;padding-right:13px;}
  .chapter-title{font-size:20px;}
  .hero .stats div{flex:1 1 40%;}
}
@media print{
  /* 화면은 다크지만 인쇄는 잉크 절약을 위해 라이트로 */
  :root{
    --bg:#fff; --bg-elev:#fff; --bg-grouped:#fff; --bg-raised:#fff;
    --label:#000; --label-2:#444; --label-3:#888;
    --fill-1:#f0f0f2; --fill-2:#e8e8ea; --fill-3:#f6f6f8;
    --separator:#d8d8dc; --card-line:#e0e0e4;
    --shadow:none; --shadow-lg:none; --blue:#0057c8;
  }
  .topbar,.sidebar,.fab,.scrim{display:none !important;}
  main{margin:0;padding:0;}
  .hero::after{display:none;}
  .qa{break-inside:avoid;box-shadow:none;border:.5px solid #ddd;}
  .code{border:.5px solid #ddd;}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="목차 열기">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
  <div class="crumb" id="crumb">{{TITLE}}</div>
  <button class="icon-btn" type="button" id="themeBtn" aria-label="라이트/다크 전환">
    <svg viewBox="0 0 20 20" fill="currentColor" id="themeIcon"><path d="M10 2.6a1 1 0 0 1 1 1V5a1 1 0 1 1-2 0V3.6a1 1 0 0 1 1-1Zm0 12.4a1 1 0 0 1 1 1v1.4a1 1 0 1 1-2 0V16a1 1 0 0 1 1-1Zm7.4-5a1 1 0 0 1-1 1H15a1 1 0 1 1 0-2h1.4a1 1 0 0 1 1 1ZM5 10a1 1 0 0 1-1 1H2.6a1 1 0 1 1 0-2H4a1 1 0 0 1 1 1Zm10.02-5.02a1 1 0 0 1 0 1.41l-1 1a1 1 0 0 1-1.41-1.41l1-1a1 1 0 0 1 1.41 0ZM7.39 12.61a1 1 0 0 1 0 1.41l-1 1a1 1 0 1 1-1.41-1.41l1-1a1 1 0 0 1 1.41 0Zm7.63 2.41a1 1 0 0 1-1.41 0l-1-1a1 1 0 0 1 1.41-1.41l1 1a1 1 0 0 1 0 1.41ZM6.39 7.39a1 1 0 0 1-1.41 0l-1-1A1 1 0 0 1 5.39 4.98l1 1a1 1 0 0 1 0 1.41ZM10 6.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>
  </button>
  <div class="progress" id="progress"></div>
</header>

<div class="scrim" id="scrim"></div>

<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="목차">
    <div class="grabber" id="grabber"></div>
    <div class="side-head">
      <div class="search" id="searchWrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="9" r="5.4"/><path d="M13.2 13.2 17 17"/></svg>
        <input type="search" id="search" placeholder="질문 검색 (번호 · 키워드)" autocomplete="off" aria-label="질문 검색">
        <button class="clear" id="clearBtn" type="button" aria-label="검색어 지우기">✕</button>
      </div>
      <div class="side-meta">
        <span><b>{{STAT_Q}}</b> 문항</span>
        <span>🔥 <b>{{STAT_HOT}}</b></span>
        <span>⚠️ <b>{{STAT_WARN}}</b></span>
      </div>
    </div>
    <div class="toc" id="toc">
      <ul id="tocList">
{{TOC}}
      </ul>
      <div class="empty" id="tocEmpty">검색 결과가 없습니다</div>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <div class="hero">
        <div class="eyebrow">Interview Prep</div>
        <h1>{{TITLE}}</h1>
        <p class="sub">{{LEAD}}</p>
        <div class="stats">
          <div><b>{{STAT_CH}}</b> 챕터</div>
          <div><b>{{STAT_Q}}</b> 문항</div>
          <div><b>{{STAT_HOT}}</b> 핵심 🔥</div>
          <div><b>{{STAT_WARN}}</b> 보완 ⚠️</div>
        </div>
      </div>
{{BODY}}
    </div>
  </main>
</div>

<div class="player" id="player" role="region" aria-label="읽어주기 재생 바">
  <div class="p-bar" id="pBar"></div>
  <button class="p-btn" type="button" id="pPrev" aria-label="이전 문항">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M6 4h2v12H6zM16 4.6v10.8c0 .8-.9 1.3-1.6.8l-7.2-5.4a1 1 0 0 1 0-1.6l7.2-5.4c.7-.5 1.6 0 1.6.8Z"/></svg>
  </button>
  <button class="p-btn main" type="button" id="pPlay" aria-label="재생 / 일시정지">
    <svg viewBox="0 0 20 20" fill="currentColor" id="pIcon"><path d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/></svg>
  </button>
  <button class="p-btn" type="button" id="pNext" aria-label="다음 문항">
    <svg viewBox="0 0 20 20" fill="currentColor"><path d="M12 4h2v12h-2zM4 4.6v10.8c0 .8.9 1.3 1.6.8l7.2-5.4a1 1 0 0 0 0-1.6L5.6 3.8C4.9 3.3 4 3.8 4 4.6Z"/></svg>
  </button>
  <div class="p-info">
    <div class="p-title" id="pTitle">읽어주기</div>

  <select class="p-voice" id="pVoice" aria-label="목소리 선택"></select>
  <button class="p-btn" type="button" id="pStop" aria-label="정지">
    <svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>
  </button>
</div>

<button class="fab" type="button" id="fab" aria-label="목차 열기">
  <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
</button>

<script>
(function(){
  var toc = document.getElementById('toc');
  var tocList = document.getElementById('tocList');
  var chapters = Array.prototype.slice.call(document.querySelectorAll('.toc-chapter'));
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc-sub a'));
  var linkById = {};
  links.forEach(function(a){ linkById[a.dataset.id] = a; });
  var isMobile = function(){ return window.matchMedia('(max-width:1080px)').matches; };

  /* ---- sheet (mobile) ---- */
  function openSheet(){ document.body.classList.add('sheet-open'); }
  function closeSheet(){ document.body.classList.remove('sheet-open'); }
  document.getElementById('fab').addEventListener('click', openSheet);
  document.getElementById('menuBtn').addEventListener('click', openSheet);
  document.getElementById('scrim').addEventListener('click', closeSheet);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeSheet();
    if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault(); if (isMobile()) openSheet();
      document.getElementById('search').focus();
    }
  });
  /* swipe-down to close */
  var sy = null, sheet = document.getElementById('sidebar');
  sheet.addEventListener('touchstart', function(e){ if (toc.scrollTop <= 0) sy = e.touches[0].clientY; }, {passive:true});
  sheet.addEventListener('touchmove', function(e){
    if (sy === null) return;
    var dy = e.touches[0].clientY - sy;
    if (dy > 70) { closeSheet(); sy = null; }
  }, {passive:true});
  sheet.addEventListener('touchend', function(){ sy = null; });

  /* ---- chapter expand ---- */
  chapters.forEach(function(ch){
    var btn = ch.querySelector('.toc-ch-btn');
    btn.addEventListener('click', function(){
      var open = ch.classList.toggle('open');
      btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      if (open) goto(btn.dataset.goto);
    });
  });
  function expand(ch){
    if (!ch || ch.classList.contains('open')) return;
    ch.classList.add('open');
    ch.querySelector('.toc-ch-btn').setAttribute('aria-expanded','true');
  }

  /* ---- navigation ---- */
  function goto(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
    if (el.classList.contains('qa')) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    history.replaceState(null,'','#'+id);
  }
  links.forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      goto(a.dataset.id);
      if (isMobile()) closeSheet();
    });
  });

  /* ---- scroll spy ---- */
  var targets = Array.prototype.slice.call(document.querySelectorAll('.qa, .group-title, .chapter'));
  var crumb = document.getElementById('crumb');
  var currentLink = null, currentChapter = null;
  var visible = new Map();

  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if (en.isIntersecting) visible.set(en.target, en.boundingClientRect.top);
      else visible.delete(en.target);
    });
    var best = null;
    visible.forEach(function(_, el){
      if (el.classList.contains('chapter')) return;
      if (!best || el.getBoundingClientRect().top < best.getBoundingClientRect().top) best = el;
    });
    if (!best) return;
    setActive(best.id);
  }, {rootMargin: '-64px 0px -70% 0px', threshold: 0});
  targets.forEach(function(t){ io.observe(t); });

  function setActive(id){
    var a = linkById[id];
    if (!a || a === currentLink) return;
    if (currentLink) currentLink.classList.remove('current');
    a.classList.add('current');
    currentLink = a;
    var ch = a.closest('.toc-chapter');
    if (ch !== currentChapter){
      if (currentChapter) currentChapter.classList.remove('active');
      ch.classList.add('active');
      currentChapter = ch;
      chapters.forEach(function(c){
        if (c !== ch && !toc.classList.contains('filtering')) {
          c.classList.remove('open');
          c.querySelector('.toc-ch-btn').setAttribute('aria-expanded','false');
        }
      });
      expand(ch);
      var lbl = ch.querySelector('.toc-ch-label').textContent;
      var num = ch.querySelector('.toc-ch-num').textContent;
      crumb.innerHTML = '<span class="c-num">' + (num === '·' ? '' : num) + '</span>' + lbl;
    } else {
      expand(ch);
    }
    if (!isMobile() && !toc.classList.contains('filtering')) {
      var r = a.getBoundingClientRect(), tr = toc.getBoundingClientRect();
      if (r.top < tr.top + 46 || r.bottom > tr.bottom - 26) {
        toc.scrollTop += (r.top - tr.top) - tr.height/2 + r.height/2;
      }
    }
  }

  /* ---- progress ---- */
  var bar = document.getElementById('progress');
  function onScroll(){
    var h = document.documentElement;
    var p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    bar.style.width = (p*100).toFixed(2) + '%';
  }
  document.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  /* ---- search ---- */
  var input = document.getElementById('search');
  var wrap = document.getElementById('searchWrap');
  var empty = document.getElementById('tocEmpty');
  function norm(s){ return s.toLowerCase().replace(/\s+/g,''); }
  function filter(){
    var q = norm(input.value);
    wrap.classList.toggle('has-value', input.value.length > 0);
    if (!q){
      toc.classList.remove('filtering');
      empty.style.display = 'none';
      chapters.forEach(function(ch){
        ch.classList.remove('hide');
        Array.prototype.forEach.call(ch.querySelectorAll('.toc-sub li'), function(li){ li.classList.remove('hide'); });
        if (ch !== currentChapter){ ch.classList.remove('open'); ch.querySelector('.toc-ch-btn').setAttribute('aria-expanded','false'); }
      });
      return;
    }
    toc.classList.add('filtering');
    var total = 0;
    chapters.forEach(function(ch){
      var hits = 0;
      Array.prototype.forEach.call(ch.querySelectorAll('.toc-sub li'), function(li){
        var a = li.querySelector('a');
        var hay = norm(a.textContent);
        var ok = hay.indexOf(q) !== -1;
        if (li.classList.contains('toc-group')) ok = false;
        li.classList.toggle('hide', !ok);
        if (ok) hits++;
      });
      var chHit = norm(ch.querySelector('.toc-ch-label').textContent).indexOf(q) !== -1;
      if (chHit){
        Array.prototype.forEach.call(ch.querySelectorAll('.toc-sub li.toc-q'), function(li){ li.classList.remove('hide'); hits++; });
      }
      ch.classList.toggle('hide', hits === 0);
      if (hits) { ch.classList.add('open'); ch.querySelector('.toc-ch-btn').setAttribute('aria-expanded','true'); }
      total += hits;
    });
    empty.style.display = total ? 'none' : 'block';
  }
  input.addEventListener('input', filter);
  document.getElementById('clearBtn').addEventListener('click', function(){ input.value=''; filter(); input.focus(); });

  /* ---- theme ---- */
  var themeBtn = document.getElementById('themeBtn');
  var themeColor = document.getElementById('themeColor');
  var saved = null;
  try { saved = localStorage.getItem('theme'); } catch(e){}
  applyTheme(saved || 'dark');   /* 기본값은 다크 — 시스템 설정과 무관 */
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme', t);
    if (themeColor) themeColor.setAttribute('content', t === 'dark' ? '#000000' : '#f2f2f7');
  }
  themeBtn.addEventListener('click', function(){
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem('theme', next); } catch(e){}
  });

  /* ---- deep link on load ---- */
  if (location.hash){
    var id = location.hash.slice(1);
    setTimeout(function(){ goto(id); }, 60);
  } else {
    expand(chapters[0]);
    chapters[0].classList.add('active');
    currentChapter = chapters[0];
  }

  /* ================= 읽어주기 (Web Speech API) ================= */
  var synth = window.speechSynthesis;
  if (!synth) {
    document.documentElement.classList.add('no-tts');
  } else {
    var PLAY_ICON = '<path d="M6.5 4.3v11.4c0 .8.9 1.3 1.6.8l8.2-5.7a1 1 0 0 0 0-1.6L8.1 3.5c-.7-.5-1.6 0-1.6.8Z"/>';
    var PAUSE_ICON = '<path d="M6 4.5h3v11H6zM11 4.5h3v11h-3z"/>';
    var RATES = [0.9, 1, 1.15, 1.3, 1.5, 0.75];

    var cards = Array.prototype.slice.call(document.querySelectorAll('.qa'));
    var player = document.getElementById('player');
    var pIcon = document.getElementById('pIcon');
    var pTitle = document.getElementById('pTitle');
    var pSub = document.getElementById('pSub');
    var pBar = document.getElementById('pBar');
    var pRate = document.getElementById('pRate');
    var pCont = document.getElementById('pCont');
    var pVoice = document.getElementById('pVoice');

    var state = {card:null, chunks:[], idx:0, rate:1, paused:false, cont:true, voice:null, token:0};

    try {
      var sr = parseFloat(localStorage.getItem('tts-rate')); if (sr) state.rate = sr;
      if (localStorage.getItem('tts-cont') === '0') state.cont = false;
    } catch(e){}
    pRate.textContent = state.rate.toFixed(2).replace(/0$/,'').replace(/\.$/,'') + '×';
    pCont.classList.toggle('on', state.cont);

    /* ---- 목소리 ---- */
    function loadVoices(){
      var all = synth.getVoices() || [];
      var ko = all.filter(function(v){ return /^ko/i.test(v.lang); });
      var list = ko.length ? ko : all;
      if (!list.length) return;
      pVoice.innerHTML = '';
      list.forEach(function(v, i){
        var o = document.createElement('option');
        o.value = v.name; o.textContent = v.name.replace(/\s*\(.*\)$/, '');
        pVoice.appendChild(o);
      });
      var saved = null;
      try { saved = localStorage.getItem('tts-voice'); } catch(e){}
      var pick = list.filter(function(v){ return v.name === saved; })[0] || list[0];
      state.voice = pick; pVoice.value = pick.name;
      pVoice.style.display = list.length > 1 ? '' : 'none';
    }
    loadVoices();
    synth.addEventListener && synth.addEventListener('voiceschanged', loadVoices);
    pVoice.addEventListener('change', function(){
      var all = synth.getVoices() || [];
      state.voice = all.filter(function(v){ return v.name === pVoice.value; })[0] || null;
      try { localStorage.setItem('tts-voice', pVoice.value); } catch(e){}
      if (state.card && !state.paused) restartCurrentChunk();
    });

    /* ---- 카드 → 읽을 텍스트 ---- */
    function cardText(card){
      var out = [];
      var num = card.querySelector('.qa-num');
      var t = card.querySelector('.qa-text');
      out.push((num ? num.textContent.replace('~', '에서 ') + '번 질문. ' : '') + (t ? t.textContent : '') + '.');
      var body = card.querySelector('.qa-body');
      if (body) {
        Array.prototype.forEach.call(body.children, function(el){
          if (el.classList.contains('code')) { out.push('코드 예시는 화면을 참고해 주세요.'); return; }
          if (el.classList.contains('table-wrap')) {
            Array.prototype.forEach.call(el.querySelectorAll('tr'), function(tr){
              var cells = Array.prototype.map.call(tr.children, function(td){ return td.textContent.trim(); })
                            .filter(Boolean).join(', ');
              if (cells) out.push(cells + '.');
            });
            return;
          }
          if (el.classList.contains('answer')) {
            var ab = el.querySelector('.a-body');     /* 'A' 칩 글자 제외 */
            out.push('답변. ' + (ab || el).textContent.trim());
            return;
          }
          if (el.classList.contains('tip')) {
            var tb = el.querySelector('div');         /* '▸' 마크 제외 */
            out.push('참고. ' + (tb || el).textContent.trim());
            return;
          }
          var txt = el.textContent.trim();
          if (txt) out.push(txt);
        });
      }
      return out.join(' ').replace(/\s+/g, ' ').replace(/·/g, ', ');
    }

    /* ---- 문장 단위 분할 (긴 발화 끊김 방지) ---- */
    function chunk(text){
      var parts = text.split(/([.!?…]+["'\u201d\u2019)\]]*\s+)/);
      var sentences = [];
      for (var i = 0; i < parts.length; i += 2) {
        var s = (parts[i] || '') + (parts[i+1] || '');
        if (s.trim()) sentences.push(s.trim());
      }
      var out = [], buf = '';
      sentences.forEach(function(s){
        while (s.length > 200) { if (buf) { out.push(buf); buf = ''; } out.push(s.slice(0, 200)); s = s.slice(200); }
        if ((buf + ' ' + s).trim().length > 200) { out.push(buf.trim()); buf = s; }
        else buf = (buf + ' ' + s).trim();
      });
      if (buf.trim()) out.push(buf.trim());
      return out.length ? out : [text];
    }

    /* ---- 재생 ---- */
    function speakChunk(){
      if (!state.card) return;
      if (state.idx >= state.chunks.length) { finishCard(); return; }
      var u = new SpeechSynthesisUtterance(state.chunks[state.idx]);
      u.lang = (state.voice && state.voice.lang) || 'ko-KR';
      if (state.voice) u.voice = state.voice;
      u.rate = state.rate; u.pitch = 1;
      var token = state.token;
      u.onend = function(){
        if (token !== state.token) return;
        state.idx++;
        updateBar();
        speakChunk();
      };
      u.onerror = function(e){
        if (token !== state.token) return;
        if (e && e.error === 'interrupted') return;
        state.idx++;
        speakChunk();
      };
      synth.speak(u);
    }
    function restartCurrentChunk(){
      state.token++;
      synth.cancel();
      setTimeout(function(){ state.token++; speakChunk(); }, 60);
    }
    function updateBar(){
      var p = state.chunks.length ? (state.idx / state.chunks.length) * 100 : 0;
      pBar.style.width = Math.min(100, p).toFixed(1) + '%';
      pSub.textContent = state.chunks.length
        ? '문장 ' + Math.min(state.idx + 1, state.chunks.length) + ' / ' + state.chunks.length
          + (state.cont ? ' · 연속 재생' : '')
        : '';
    }
    function play(card){
      if (!card) return;
      stop(true);
      state.card = card;
      state.chunks = chunk(cardText(card));
      state.idx = 0; state.paused = false; state.token++;
      card.classList.add('speaking');
      document.body.classList.add('tts-on');
      pIcon.innerHTML = PAUSE_ICON;
      var num = card.querySelector('.qa-num'), t = card.querySelector('.qa-text');
      pTitle.textContent = (num ? num.textContent + '. ' : '') + (t ? t.textContent : '');
      updateBar();
      card.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'});
      speakChunk();
    }
    function finishCard(){
      var cur = state.card;
      if (cur) cur.classList.remove('speaking');
      if (state.cont && cur) {
        var i = cards.indexOf(cur);
        if (i > -1 && i + 1 < cards.length) { play(cards[i + 1]); return; }
      }
      stop();
    }
    function stop(keepBar){
      state.token++;
      synth.cancel();
      if (state.card) state.card.classList.remove('speaking');
      state.card = null; state.chunks = []; state.idx = 0; state.paused = false;
      pIcon.innerHTML = PLAY_ICON;
      if (!keepBar) {
        document.body.classList.remove('tts-on');
        pBar.style.width = '0%';
      }
    }
    function toggle(){
      if (!state.card) { play(cards[0]); return; }
      if (state.paused) { synth.resume(); state.paused = false; pIcon.innerHTML = PAUSE_ICON; }
      else { synth.pause(); state.paused = true; pIcon.innerHTML = PLAY_ICON; }
    }
    function jump(step){
      var base = state.card ? cards.indexOf(state.card) : -1;
      var next = cards[base + step];
      if (next) play(next);
    }

    /* ---- 카드별 버튼 ---- */
    cards.forEach(function(card){
      var btn = document.createElement('button');
      btn.className = 'speak-btn';
      btn.type = 'button';
      btn.setAttribute('aria-label', '이 문항 읽어주기');
      btn.title = '읽어주기';
      btn.innerHTML = '<svg viewBox="0 0 20 20" fill="currentColor">' + PLAY_ICON + '</svg>';
      btn.addEventListener('click', function(e){
        e.stopPropagation();
        if (state.card === card) toggle(); else play(card);
      });
      var title = card.querySelector('.qa-title');
      if (title) title.appendChild(btn);
    });

    /* ---- 컨트롤 ---- */
    document.getElementById('pPlay').addEventListener('click', toggle);
    document.getElementById('pStop').addEventListener('click', function(){ stop(); });
    document.getElementById('pPrev').addEventListener('click', function(){ jump(-1); });
    document.getElementById('pNext').addEventListener('click', function(){ jump(1); });
    pRate.addEventListener('click', function(){
      var i = RATES.indexOf(state.rate);
      state.rate = RATES[(i + 1) % RATES.length];
      pRate.textContent = String(state.rate) + '×';
      try { localStorage.setItem('tts-rate', state.rate); } catch(e){}
      if (state.card && !state.paused) restartCurrentChunk();
    });
    pCont.addEventListener('click', function(){
      state.cont = !state.cont;
      pCont.classList.toggle('on', state.cont);
      try { localStorage.setItem('tts-cont', state.cont ? '1' : '0'); } catch(e){}
      updateBar();
    });

    /* ---- 단축키: P 재생/정지, N 다음, B 이전 ---- */
    document.addEventListener('keydown', function(e){
      if (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
      var k = e.key.toLowerCase();
      if (k === 'p') { e.preventDefault(); toggle(); }
      else if (k === 'n' && state.card) { e.preventDefault(); jump(1); }
      else if (k === 'b' && state.card) { e.preventDefault(); jump(-1); }
      else if (e.key === 'Escape' && state.card) stop();
    });

    /* ---- 크롬 15초 정지 버그 우회 ---- */
    setInterval(function(){
      if (state.card && !state.paused && synth.speaking) { synth.pause(); synth.resume(); }
    }, 9000);

    window.addEventListener('beforeunload', function(){ synth.cancel(); });
  }

})();
</script>
</body>
</html>
